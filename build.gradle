// Top-level build file where you can add configuration options common to all sub-projects/modules.

buildscript {
    repositories {
        google()
        mavenCentral()
    }

    dependencies {
        classpath buildLibs.android.gradle.plugin
        classpath buildLibs.kotlin.gradle.plugin
        classpath buildLibs.ksp.gradle.plugin
        classpath buildLibs.dagger.hilt.gradle.plugin
        classpath buildLibs.firebase.crashlytics.gradle
        classpath buildLibs.google.services
    }

}

tasks.register('clean', Delete) {
    delete rootProject.layout.buildDirectory
}

allprojects {
    repositories {
        google()
        mavenCentral()
        maven { url 'https://jitpack.io' }

    }
}
